[tool.poetry]
name = "legal-ai-assistant"
version = "0.1.0"
description = "Юридический ИИ-ассистент Банка СПБ (Hack&Change 2026)"
authors = ["Участник 1", "Участник 2", "Участник 3"]
readme = "README.md"
packages = [
    { include = "core" },
    { include = "backend" },
    { include = "frontend" },
    { include = "worker" },
    { include = "submission" },
]

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
pydantic = "^2.9"
httpx = "^0.27"
numpy = "^1.26"
bm25s = "^0.2"
faiss-cpu = "^1.8"
fastapi = "^0.115"
uvicorn = { version = "^0.32", extras = ["standard"] }
psycopg = { version = "^3.2", extras = ["binary"] }
argon2-cffi = "^23.1"
streamlit = "^1.40"
requests = "^2.32"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.24"
ruff = "^0.7"
mypy = "^1.13"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

# ЗАМОРОЖЕННЫЕ ЗАВИСИМОСТИ.
# Списки в секциях [tool.poetry.dependencies] и
# [tool.poetry.group.dev.dependencies] считаются ОБЩИМИ ДЛЯ ВСЕХ УЧАСТНИКОВ
# и не подлежат изменению без согласования команды.
# Агент не вправе удалять, понижать, повышать или переименовывать уже
# добавленные зависимости. Новая зависимость добавляется только по явной
# команде пользователя в обсуждении, с записью в CHANGELOG раздела
# "Изменения замороженного набора зависимостей".
# Совместимость с регламентом конкурса ограничивает набор библиотек:
# см. docs/ARCHITECTURE.md §0.4 (REG-03) и §13.5.
